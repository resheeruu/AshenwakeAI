# AshenAI log rotation
# Install: sudo cp logrotate.conf /etc/logrotate.d/ashenai
# Verify: sudo logrotate -d /etc/logrotate.d/ashenai

/data/ashenai.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 ashenu ashenu
    sharedscripts
    postrotate
        # Signal the running process to reopen log files
        pkill -USR1 -f "scripts/start.sh" 2>/dev/null || true
    endscript
}

/backups/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 ashenu ashenu
}

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "ashenai-local"

  sources:
    youtube: false
    bandcamp: true
    soundcloud: true
    twitch: true
    vimeo: true
    http: true
    local: false

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

  bufferDurationMs: 400
  frameBufferDurationMs: 5000
  opusEncodingQuality: 10
  resamplingQuality: LOW
  trackStuckThresholdMs: 10000
  playerUpdateInterval: 5
  youtubePlaylistLoadLimit: 6
  youtubeSearchEnabled: true
  soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - ANDROID_VR
      - ANDROID_MUSIC
      - IOS
      - MWEB
      - WEB
      - MUSIC
      - WEBEMBEDDED

    clientOptions:
      MUSIC:
        playback: false
        playlistLoading: false
        videoLoading: false
        searching: true

      WEBEMBEDDED:
        playback: true
        playlistLoading: false
        videoLoading: true
        searching: false

filters:
  volume: true
  equalizer: true
  karaoke: true
  timescale: true
  tremolo: true
  vibrato: true
  distortion: true
  rotation: true
  channelMix: true
  lowPass: true

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG

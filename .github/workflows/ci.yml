name: AshenAI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # --- STAGE: Dependencies ---
      - name: Install dependencies
        run: npm ci

      # --- STAGE: Typecheck ---
      - name: TypeScript typecheck
        run: npm run typecheck

      # --- STAGE: Build ---
      - name: Build
        run: npm run build

      # --- STAGE: Mandatory Tests ---
      - name: Run mandatory test suite
        run: npm test

      # --- STAGE: Quality Gates ---
      - name: Dependency check
        run: |
          set -o pipefail
          npm ls --depth=0 2>&1 | head -50

      # --- STAGE: Security Gate (blocking) ---
      - name: npm audit (high+)
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "❌ npm audit found high/critical vulnerabilities — failing CI"
            exit 1
          fi
          echo "✅ npm audit passed (no high/critical vulnerabilities in production deps)"

      # --- STAGE: Optional Checks ---
      - name: Icon validation
        run: |
          set +e
          npm run icons:validate 2>&1 | tail -5
          echo "ℹ️ Icon validation completed — review any warnings above"
        continue-on-error: true

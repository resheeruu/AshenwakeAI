name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.0
          ndk: 21.4.7075529

      - name: Install dependencies
        run: |
          cd xykana
          npm ci

      - name: Build web app
        run: |
          cd xykana
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd xykana
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd xykana/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xykana-apk
          path: xykana/android/app/build/outputs/apk/debug/app-debug.apk

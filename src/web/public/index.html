<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AshenAI</title>

  <style>
    :root {
      --bg: #07070b;
      --surface: rgba(18, 18, 27, .78);
      --surface-2: #11111a;
      --surface-3: #191925;
      --border: rgba(255,255,255,.09);
      --border-strong: rgba(255,255,255,.15);
      --text: #f7f7fb;
      --muted: #9696a8;
      --accent: #9b7cff;
      --accent-2: #6d5dfc;
      --success: #61e294;
      --danger: #ff6f7d;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 118px;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(123, 92, 255, .18),
          transparent 34%
        ),
        radial-gradient(
          circle at 100% 45%,
          rgba(73, 91, 255, .08),
          transparent 30%
        ),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );
      background-size: 44px 44px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 75%
      );
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 13px 18px;

      background: rgba(7,7,11,.78);
      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      overflow: hidden;
      flex-shrink: 0;
      background: #111118;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 0 24px rgba(255,100,40,.18);
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }


      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #a98cff,
          #6253ed
        );

      box-shadow:
        0 0 24px rgba(125,94,255,.28),
        inset 0 1px 0 rgba(255,255,255,.25);

      font-size: 21px;
      font-weight: 900;
      color: white;
    }

    .brand-copy {
      min-width: 0;
    }

    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 6px;
      color: var(--success);
      font-size: 10px;
      font-weight: 700;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 9px rgba(97,226,148,.7);
    }

    #reset {
      border: 1px solid var(--border-strong);
      background: rgba(255,255,255,.045);
      color: #e9e9f0;

      border-radius: 11px;
      padding: 9px 12px;

      cursor: pointer;
      font-weight: 650;
      font-size: 12px;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }

    #reset:hover {
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.22);
      transform: translateY(-1px);
    }

    #reset:active {
      transform: translateY(0);
    }

    #chat {
      width: 100%;
      max-width: 920px;

      margin: auto;
      padding: 28px 16px 35px;
    }

    .message {
      max-width: min(82%, 720px);

      margin: 14px 0;
      padding: 13px 16px;

      border-radius: 18px;

      white-space: pre-wrap;
      overflow-wrap: anywhere;

      line-height: 1.6;
      font-size: 15px;

      box-shadow: 0 8px 30px rgba(0,0,0,.12);

      animation: messageIn .2s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user {
      margin-left: auto;

      background:
        linear-gradient(
          135deg,
          rgba(110,91,245,.42),
          rgba(71,61,142,.34)
        );

      border: 1px solid rgba(151,130,255,.18);
      border-bottom-right-radius: 6px;
    }

    .assistant {
      margin-right: auto;

      background:
        linear-gradient(
          145deg,
          rgba(25,25,37,.94),
          rgba(15,15,23,.94)
        );

      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .error {
      color: var(--danger);
    }

    .welcome {
      margin: 70px auto 40px;
      max-width: 760px;
      text-align: center;
      padding: 28px 18px;
    }

    .welcome-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      font-size: 38px;
      background:
        radial-gradient(circle at 30% 20%, rgba(160,140,255,.35), transparent 55%),
        linear-gradient(145deg, #24203d, #14141d);
      border: 1px solid rgba(160,140,255,.25);
      box-shadow:
        0 18px 55px rgba(0,0,0,.35),
        0 0 45px rgba(110,90,255,.12);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #aaa4c8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #61e294;
      box-shadow: 0 0 12px rgba(97,226,148,.8);
    }

    .welcome h2 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
      letter-spacing: -.035em;
      background: linear-gradient(135deg, #fff, #aaa4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome-text {
      max-width: 620px;
      margin: 16px auto 28px;
      color: #92929f;
      line-height: 1.65;
      font-size: 14px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 680px;
      margin: auto;
    }

    .quick-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      text-align: left;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      background: rgba(24,24,34,.72);
      color: #fff;
      cursor: pointer;
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }

    .quick-card:hover {
      transform: translateY(-2px);
      border-color: rgba(145,125,255,.35);
      background: rgba(38,35,55,.82);
    }

    .quick-card:active {
      transform: translateY(0);
    }

    .quick-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      font-size: 19px;
    }

    .quick-card strong,
    .quick-card small {
      display: block;
    }

    .quick-card strong {
      margin-bottom: 3px;
      font-size: 13px;
    }

    .quick-card small {
      color: #7f7f8c;
      font-size: 11px;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      .welcome {
        margin-top: 38px;
        padding: 20px 8px;
      }

      .welcome-logo {
        width: 66px;
        height: 66px;
        border-radius: 20px;
        font-size: 32px;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .welcome h2 {
        font-size: 30px;
      }
    }


    .typing {
      opacity: .65;
    }

    form {
      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      z-index: 20;

      padding: 10px 10px 13px;

      background: rgba(7,7,11,.82);
      border-top: 1px solid var(--border);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .input-row {
      width: 100%;
      max-width: 920px;

      margin: auto;

      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    textarea {
      flex: 1;

      resize: none;

      min-height: 48px;
      max-height: 150px;

      border: 1px solid var(--border-strong);
      border-radius: 15px;

      background: rgba(20,20,29,.92);
      color: var(--text);

      padding: 13px 14px;

      outline: none;

      font: inherit;
      font-size: 14px;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    textarea::placeholder {
      color: #777789;
    }

    textarea:focus {
      border-color: rgba(143,119,255,.62);
      background: rgba(24,24,35,.98);

      box-shadow:
        0 0 0 3px rgba(119,91,255,.10),
        0 8px 30px rgba(0,0,0,.18);
    }

    button {
      font-family: inherit;
    }

    @media (max-width: 600px) {
      header {
        padding: 11px 13px;
      }

      .logo {
        width: 37px;
        height: 37px;
        border-radius: 12px;
      }

      header h1 {
        font-size: 16px;
      }

      #chat {
        padding: 20px 11px 28px;
      }

      .message {
        max-width: 91%;
        font-size: 14px;
        padding: 12px 14px;
      }

      body {
        padding-bottom: 112px;
      }
    }

    #send {
      min-width: 72px;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      color: white;
      font-weight: 750;
      cursor: pointer;
      background: linear-gradient(135deg, #8b6cff, #6347d8);
      box-shadow: 0 8px 25px rgba(105,75,220,.25);
      transition: .18s ease;
    }

    #send:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(105,75,220,.35);
    }

    #send:active {
      transform: translateY(0);
    }

    #send:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    #reset {
      transition: .18s ease;
    }

    #reset:hover {
      border-color: rgba(139,108,255,.45) !important;
    }

      );

      border-bottom-left-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,.16);
    }

    .assistant.typing {
      color: #a7a7b5;
      opacity: 1;
    }

    .assistant.typing::after {
      content: "•••";
      display: inline-block;
      margin-left: 6px;
      letter-spacing: 3px;
      animation: typingDots 1.2s infinite;
    }

    @keyframes typingDots {
      0%, 20% { opacity: .25; }
      50% { opacity: 1; }
      80%, 100% { opacity: .25; }
    }

    .error {
      color: #ff9292 !important;
      border-color: rgba(255,100,100,.20) !important;
      background: rgba(80,25,30,.30) !important;
    }

    .message .code-block {
      display: block;
      margin: 12px 0;
      padding: 13px;
      overflow-x: auto;
      border-radius: 11px;
      background: #09090e;
      border: 1px solid rgba(255,255,255,.08);
      color: #e8e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre;
    }

    .message .inline-code {
      padding: 2px 5px;
      border-radius: 5px;
      background: rgba(255,255,255,.07);
      color: #d7caff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .9em;
    }

    .message strong {
      font-weight: 750;
      color: #fff;
    }

    .message a {
      color: #ad99ff;
      text-decoration: underline;
    }


    .thinking-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 18px;
    }

    .thinking-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9b87ff;
      animation: thinkingPulse 1.1s infinite ease-in-out;
    }

    .thinking-indicator span:nth-child(2) {
      animation-delay: .15s;
    }

    .thinking-indicator span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes thinkingPulse {
      0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    .retry-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      color: #c9c1df;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }

    .retry-btn:hover {
      background: rgba(139,108,255,.12);
      border-color: rgba(139,108,255,.30);
    }

      }

      textarea {
        min-height: 46px;
        padding: 12px !important;
        font-size: 14px;
      }

      #send {
        min-width: 62px;
        min-height: 46px;
        padding: 0 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

</style>
  <link rel="icon" type="image/png" href="/assets/logo-1.png">
</head>

<body>

<header>
  <div class="brand">
    <div class="logo"><img src="/assets/logo-1.png" alt="AshenAI logo"></div>

    <div>
      <h1>AshenAI</h1>
      <p>AI assistant</p>
    </div>
  </div>

  <button id="reset" type="button">
    New Chat
  </button>
</header>

<main id="chat">
  <section class="welcome">
    <div class="welcome-logo"><img src="/assets/logo-1.png" alt="AshenAI logo"></div>

    <div class="eyebrow">
      <span class="status-dot"></span>
      ASHENAI ONLINE
    </div>

    <h2>How can I help you today?</h2>

    <p class="welcome-text">
      Ask questions, explore ideas, write code, analyze information,
      or simply start a conversation.
    </p>

    <div class="quick-grid">
      <button class="quick-card" type="button"
        data-prompt="Explain this topic in a simple way.">
        <span class="quick-icon">💡</span>
        <span>
          <strong>Explain</strong>
          <small>Make something easier to understand</small>
        </span>
      </button>

      <button class="quick-card" type="button"
        data-prompt="Help me write or improve something.">
        <span class="quick-icon">✍️</span>
        <span>
          <strong>Write</strong>
          <small>Create or improve text</small>
        </span>
      </button>

      <button class="quick-card" type="button"
        data-prompt="Help me solve this problem step by step.">
        <span class="quick-icon">🧠</span>
        <span>
          <strong>Solve</strong>
          <small>Work through a problem</small>
        </span>
      </button>

      <button class="quick-card" type="button"
        data-prompt="Help me write, debug, or understand code.">
        <span class="quick-icon">💻</span>
        <span>
          <strong>Code</strong>
          <small>Build or debug something</small>
        </span>
      </button>
    </div>
  </section>
</main>

<form id="form">

  <div class="input-row">

    <textarea
      id="input"
      placeholder="Message AshenAI..."
      maxlength="4000"
      autocomplete="off"
    ></textarea>

    <button
      id="send"
      type="submit"
    >
      Send
    </button>

  </div>

</form>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const reset = document.getElementById("reset");
  const chat = document.getElementById("chat");

  const SESSION_KEY = "ashenai_web_session";

  let sessionId =
    localStorage.getItem(SESSION_KEY);

  if (!sessionId) {
    sessionId =
      crypto.randomUUID().replaceAll("-", "");

    localStorage.setItem(
      SESSION_KEY,
      sessionId
    );
  }

  function addMessage(text, type) {
    if (type === "assistant") {
      const wrapper = document.createElement("div");
      wrapper.className = "assistant-wrap";

      const div = document.createElement("div");
      div.className = "message assistant";
      div.appendChild(formatAssistantText(text));

      const copy = document.createElement("button");
      copy.type = "button";
      copy.className = "copy-btn";
      copy.textContent = "Copy";

      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(div.textContent || "");
          copy.textContent = "Copied!";
          setTimeout(() => {
            copy.textContent = "Copy";
          }, 1400);
        } catch {
          copy.textContent = "Copy failed";
          setTimeout(() => {
            copy.textContent = "Copy";
          }, 1400);
        }
      });

      wrapper.appendChild(div);
      wrapper.appendChild(copy);
      chat.appendChild(wrapper);

      window.scrollTo(
        0,
        document.body.scrollHeight
      );

      return div;
    }

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);

    window.scrollTo(
      0,
      document.body.scrollHeight
    );

    return div;
  }

  function headers() {
    return {
      "Content-Type": "application/json",
      "x-session-id": sessionId
    };
  }

  function formatAssistantText(text) {
    const fragment = document.createDocumentFragment();
    const lines = String(text).split("\n");

    let code = false;
    let codeBuffer = [];

    for (const line of lines) {
      if (line.trim().startsWith("```")) {
        if (code) {
          const pre = document.createElement("code");
          pre.className = "code-block";
          pre.textContent = codeBuffer.join("\n");
          fragment.appendChild(pre);
          codeBuffer = [];
        }

        code = !code;
        continue;
      }

      if (code) {
        codeBuffer.push(line);
        continue;
      }

      const div = document.createElement("div");

      let safe = line
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      safe = safe.replace(
        /`([^`]+)`/g,
        '<span class="inline-code">$1</span>'
      );

      safe = safe.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );

      div.innerHTML = safe || "&nbsp;";
      fragment.appendChild(div);
    }

    if (code && codeBuffer.length) {
      const pre = document.createElement("code");
      pre.className = "code-block";
      pre.textContent = codeBuffer.join("\n");
      fragment.appendChild(pre);
    }

    return fragment;
  }


  async function loadHistory() {
    try {
      const response =
        await fetch("/api/history", {
          headers: headers()
        });

      const data =
        await response.json();

      if (!response.ok || !data.ok) {
        return;
      }

      if (
        Array.isArray(data.history) &&
        data.history.length
      ) {
        chat.innerHTML = "";

        for (const message of data.history) {
          addMessage(
            message.content,
            message.role === "user"
              ? "user"
              : "assistant"
          );
        }

        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "instant"
        });
      }
    } catch {
      // History is optional.
    }
  }

  form.addEventListener(
    "submit",
    async (event) => {
      event.preventDefault();

      const message =
        input.value.trim();

      if (!message || send.disabled) {
        return;
      }

      addMessage(
        message,
        "user"
      );

      input.value = "";
      send.disabled = true;
      reset.disabled = true;
      send.textContent = "...";

      const thinking =
        addMessage(
          "",
          "assistant"
        );

      thinking.classList.add("typing");

      thinking.innerHTML =
        '<span class="thinking-indicator">' +
        '<span></span><span></span><span></span>' +
        '</span>';

      try {
        const response =
          await fetch("/api/chat", {
            method: "POST",
            headers: headers(),
            body: JSON.stringify({
              message
            })
          });

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.ok
        ) {
          throw new Error(
            data.error ||
            "Request failed."
          );
        }

        thinking.classList.remove(
          "typing"
        );

        thinking.textContent =
          data.text || "No response.";
      } catch (error) {
        thinking.classList.remove(
          "typing"
        );

        thinking.classList.add(
          "error"
        );

        const errorText =
          error instanceof Error
            ? error.message
            : "Something went wrong.";

        thinking.textContent = "❌ " + errorText;

        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "retry-btn";
        retry.textContent = "Retry";

        retry.addEventListener("click", () => {
          input.value = message;
          form.requestSubmit();
        });

        thinking.appendChild(
          document.createTextNode(" ")
        );

        thinking.appendChild(retry);
      } finally {
        send.disabled = false;
        reset.disabled = false;
        send.textContent = "Send";

        input.focus();
      }
    }
  );

  reset.addEventListener(
    "click",
    async () => {
      if (
        !confirm(
          "Start a new conversation?"
        )
      ) {
        return;
      }

      reset.disabled = true;

      try {
        await fetch(
          "/api/reset",
          {
            method: "POST",
            headers: headers()
          }
        );

        chat.innerHTML = "";

        addMessage(
          "👋 New conversation started. How can I help?",
          "assistant"
        );
      } catch {
        addMessage(
          "❌ Could not reset the conversation.",
          "assistant error"
        );
      } finally {
        reset.disabled = false;
        input.focus();
      }
    }
  );

  input.addEventListener(
    "keydown",
    (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        form.requestSubmit();
      }
    }
  );


  document.querySelectorAll(".quick-card").forEach((card) => {
    card.addEventListener("click", () => {
      const prompt = card.dataset.prompt;

      if (!prompt || send.disabled) {
        return;
      }

      input.value = prompt;
      input.focus();
      form.requestSubmit();
    });
  });

  loadHistory();
  input.focus();
</script>

</body>
</html>

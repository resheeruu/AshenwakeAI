<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AshenAI</title>

  <style>
    :root {
      --bg: #07070b;
      --surface: rgba(18, 18, 27, .78);
      --surface-2: #11111a;
      --surface-3: #191925;
      --border: rgba(255,255,255,.09);
      --border-strong: rgba(255,255,255,.15);
      --text: #f7f7fb;
      --muted: #9696a8;
      --accent: #9b7cff;
      --accent-2: #6d5dfc;
      --success: #61e294;
      --danger: #ff6f7d;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 118px;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(123, 92, 255, .18),
          transparent 34%
        ),
        radial-gradient(
          circle at 100% 45%,
          rgba(73, 91, 255, .08),
          transparent 30%
        ),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );
      background-size: 44px 44px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 75%
      );
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 13px 18px;

      background: rgba(7,7,11,.78);
      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      overflow: hidden;
      flex-shrink: 0;
      background: #111118;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 0 24px rgba(255,100,40,.18);
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }


      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #a98cff,
          #6253ed
        );

      box-shadow:
        0 0 24px rgba(125,94,255,.28),
        inset 0 1px 0 rgba(255,255,255,.25);

      font-size: 21px;
      font-weight: 900;
      color: white;
    }

    .brand-copy {
      min-width: 0;
    }

    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 6px;
      color: var(--success);
      font-size: 10px;
      font-weight: 700;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 9px rgba(97,226,148,.7);
    }

    #reset {
      border: 1px solid var(--border-strong);
      background: rgba(255,255,255,.045);
      color: #e9e9f0;

      border-radius: 11px;
      padding: 9px 12px;

      cursor: pointer;
      font-weight: 650;
      font-size: 12px;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }

    #reset:hover {
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.22);
      transform: translateY(-1px);
    }

    #reset:active {
      transform: translateY(0);
    }

    #chat {
      width: 100%;
      max-width: 920px;

      margin: auto;
      padding: 28px 16px 35px;
    }

    .message {
      max-width: min(82%, 720px);

      margin: 14px 0;
      padding: 13px 16px;

      border-radius: 18px;

      white-space: pre-wrap;
      overflow-wrap: anywhere;

      line-height: 1.6;
      font-size: 15px;

      box-shadow: 0 8px 30px rgba(0,0,0,.12);

      animation: messageIn .2s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user {
      margin-left: auto;

      background:
        linear-gradient(
          135deg,
          rgba(110,91,245,.42),
          rgba(71,61,142,.34)
        );

      border: 1px solid rgba(151,130,255,.18);
      border-bottom-right-radius: 6px;
    }

    .assistant {
      margin-right: auto;

      background:
        linear-gradient(
          145deg,
          rgba(25,25,37,.94),
          rgba(15,15,23,.94)
        );

      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .error {
      color: var(--danger);
    }

    .welcome {
      margin: 70px auto 40px;
      max-width: 760px;
      text-align: center;
      padding: 28px 18px;
    }

    .welcome-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      font-size: 38px;
      background:
        radial-gradient(circle at 30% 20%, rgba(160,140,255,.35), transparent 55%),
        linear-gradient(145deg, #24203d, #14141d);
      border: 1px solid rgba(160,140,255,.25);
      box-shadow:
        0 18px 55px rgba(0,0,0,.35),
        0 0 45px rgba(110,90,255,.12);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #aaa4c8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #61e294;
      box-shadow: 0 0 12px rgba(97,226,148,.8);
    }

    .welcome h2 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
      letter-spacing: -.035em;
      background: linear-gradient(135deg, #fff, #aaa4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome-text {
      max-width: 620px;
      margin: 16px auto 28px;
      color: #92929f;
      line-height: 1.65;
      font-size: 14px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 680px;
      margin: auto;
    }

    .quick-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      text-align: left;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      background: rgba(24,24,34,.72);
      color: #fff;
      cursor: pointer;
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }

    .quick-card:hover {
      transform: translateY(-2px);
      border-color: rgba(145,125,255,.35);
      background: rgba(38,35,55,.82);
    }

    .quick-card:active {
      transform: translateY(0);
    }

    .quick-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      font-size: 19px;
    }

    .quick-card strong,
    .quick-card small {
      display: block;
    }

    .quick-card strong {
      margin-bottom: 3px;
      font-size: 13px;
    }

    .quick-card small {
      color: #7f7f8c;
      font-size: 11px;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      .welcome {
        margin-top: 38px;
        padding: 20px 8px;
      }

      .welcome-logo {
        width: 66px;
        height: 66px;
        border-radius: 20px;
        font-size: 32px;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .welcome h2 {
        font-size: 30px;
      }
    }


    .typing {
      opacity: .65;
    }

    form {
      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      z-index: 20;

      padding: 10px 10px 13px;

      background: rgba(7,7,11,.82);
      border-top: 1px solid var(--border);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .input-row {
      width: 100%;
      max-width: 920px;

      margin: auto;

      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    textarea {
      flex: 1;

      resize: none;

      min-height: 48px;
      max-height: 150px;

      border: 1px solid var(--border-strong);
      border-radius: 15px;

      background: rgba(20,20,29,.92);
      color: var(--text);

      padding: 13px 14px;

      outline: none;

      font: inherit;
      font-size: 14px;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    textarea::placeholder {
      color: #777789;
    }

    textarea:focus {
      border-color: rgba(143,119,255,.62);
      background: rgba(24,24,35,.98);

      box-shadow:
        0 0 0 3px rgba(119,91,255,.10),
        0 8px 30px rgba(0,0,0,.18);
    }

    button {
      font-family: inherit;
    }

    @media (max-width: 600px) {
      header {
        padding: 11px 13px;
      }

      .logo {
        width: 37px;
        height: 37px;
        border-radius: 12px;
      }

      header h1 {
        font-size: 16px;
      }

      #chat {
        padding: 20px 11px 28px;
      }

      .message {
        max-width: 91%;
        font-size: 14px;
        padding: 12px 14px;
      }

      body {
        padding-bottom: 112px;
      }
    }

    .welcome-logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: inherit;
    }

</style>
  <link rel="icon" type="image/png" href="/assets/logo-1.png">
</head>

<body>

<header>
  <div class="brand">
    <div class="logo"><img src="/assets/logo-1.png" alt="AshenAI logo"></div>

    <div>
      <h1>AshenAI</h1>
      <p>AI assistant</p>
    </div>
  </div>

  <button id="reset" type="button">
    New Chat
  </button>
</header>

<main id="chat">
  <section class="welcome">
    <div class="welcome-logo"><img src="/assets/logo-1.png" alt="AshenAI logo"></div>

    <div class="eyebrow">
      <span class="status-dot"></span>
      ASHENAI ONLINE
    </div>

    <h2>How can I help you today?</h2>

    <p class="welcome-text">
      Ask questions, explore ideas, write code, analyze information,
      or simply start a conversation.
    </p>

    <div class="quick-grid">
      <button class="quick-card" type="button"
        data-prompt="Explain this topic in a simple way.">
        <span class="quick-icon">💡</span>
        <span>
          <strong>Explain</strong>
          <small>Make something easier to understand</small>
        </span>
      </button>

      <button class="quick-card" type="button"
        data-prompt="Help me write or improve something.">
        <span class="quick-icon">✍️</span>
        <span>
          <strong>Write</strong>
          <small>Create or improve text</small>
        </span>
      </button>

      <button class="quick-card" type="button"
        data-prompt="Help me solve this problem step by step.">
        <span class="quick-icon">🧠</span>
        <span>
          <strong>Solve</strong>
          <small>Work through a problem</small>
        </span>
      </button>

      <button class="quick-card" type="button"
        data-prompt="Help me write, debug, or understand code.">
        <span class="quick-icon">💻</span>
        <span>
          <strong>Code</strong>
          <small>Build or debug something</small>
        </span>
      </button>
    </div>
  </section>
</main>

<form id="form">

  <div class="input-row">

    <textarea
      id="input"
      placeholder="Message AshenAI..."
      maxlength="4000"
      autocomplete="off"
    ></textarea>

    <button
      id="send"
      type="submit"
    >
      Send
    </button>

  </div>

</form>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const reset = document.getElementById("reset");
  const chat = document.getElementById("chat");

  const SESSION_KEY = "ashenai_web_session";

  let sessionId =
    localStorage.getItem(SESSION_KEY);

  if (!sessionId) {
    sessionId =
      crypto.randomUUID().replaceAll("-", "");

    localStorage.setItem(
      SESSION_KEY,
      sessionId
    );
  }

  function addMessage(text, type) {
    const div =
      document.createElement("div");

    div.className =
      "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    window.scrollTo(
      0,
      document.body.scrollHeight
    );

    return div;
  }

  function headers() {
    return {
      "Content-Type": "application/json",
      "x-session-id": sessionId
    };
  }

  async function loadHistory() {
    try {
      const response =
        await fetch("/api/history", {
          headers: headers()
        });

      const data =
        await response.json();

      if (!response.ok || !data.ok) {
        return;
      }

      if (
        Array.isArray(data.history) &&
        data.history.length
      ) {
        chat.innerHTML = "";

        for (const message of data.history) {
          addMessage(
            message.content,
            message.role === "user"
              ? "user"
              : "assistant"
          );
        }
      }
    } catch {
      // History is optional.
    }
  }

  form.addEventListener(
    "submit",
    async (event) => {
      event.preventDefault();

      const message =
        input.value.trim();

      if (!message || send.disabled) {
        return;
      }

      addMessage(
        message,
        "user"
      );

      input.value = "";
      send.disabled = true;
      reset.disabled = true;
      send.textContent = "...";

      const thinking =
        addMessage(
          "AshenAI is thinking...",
          "assistant"
        );

      thinking.classList.add("typing");

      try {
        const response =
          await fetch("/api/chat", {
            method: "POST",
            headers: headers(),
            body: JSON.stringify({
              message
            })
          });

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.ok
        ) {
          throw new Error(
            data.error ||
            "Request failed."
          );
        }

        thinking.classList.remove(
          "typing"
        );

        thinking.textContent =
          data.text || "No response.";
      } catch (error) {
        thinking.classList.remove(
          "typing"
        );

        thinking.classList.add(
          "error"
        );

        thinking.textContent =
          "❌ " +
          (
            error instanceof Error
              ? error.message
              : "Something went wrong."
          );
      } finally {
        send.disabled = false;
        reset.disabled = false;
        send.textContent = "Send";

        input.focus();
      }
    }
  );

  reset.addEventListener(
    "click",
    async () => {
      if (
        !confirm(
          "Start a new conversation?"
        )
      ) {
        return;
      }

      reset.disabled = true;

      try {
        await fetch(
          "/api/reset",
          {
            method: "POST",
            headers: headers()
          }
        );

        chat.innerHTML = "";

        addMessage(
          "👋 New conversation started. How can I help?",
          "assistant"
        );
      } catch {
        addMessage(
          "❌ Could not reset the conversation.",
          "assistant error"
        );
      } finally {
        reset.disabled = false;
        input.focus();
      }
    }
  );

  input.addEventListener(
    "keydown",
    (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        form.requestSubmit();
      }
    }
  );

  loadHistory();
  input.focus();
</script>

</body>
</html>
